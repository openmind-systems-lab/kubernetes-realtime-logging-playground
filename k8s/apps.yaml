apiVersion: v1
kind: Namespace
metadata:
  name: logging-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: logging-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: app
          image: omsl/logging-demo:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_NAME
              value: orders-api
            - name: PAYMENTS_URL
              value: http://payments-api:8080/charge
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: logging-demo
spec:
  selector:
    app: orders-api
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: logging-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        - name: app
          image: omsl/logging-demo:v1
          imagePullPolicy: IfNotPresent
          env:
            - {name: APP_NAME, value: payments-api}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: logging-demo
spec:
  selector:
    app: payments-api
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: background-worker
  namespace: logging-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: background-worker
  template:
    metadata:
      labels:
        app: background-worker
    spec:
      containers:
        - name: app
          image: omsl/logging-demo:v1
          imagePullPolicy: IfNotPresent
          env:
            - {name: APP_NAME, value: background-worker}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
